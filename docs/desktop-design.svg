  <text x="110" y="250" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1F2640">Bring everyone</text>
  <text x="110" y="318" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1F2640">together to build</text>
  <text x="110" y="386" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1F2640">better products.</text>
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="22" fill="#5E6477">Manage makes it simple for software teams to</text>
