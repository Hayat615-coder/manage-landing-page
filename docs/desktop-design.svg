  <text x="780" y="815" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">02</text>
  <text x="840" y="810" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2640">Advanced built-in reports</text>
  <text x="840" y="845" font-family="Arial, sans-serif" font-size="18" fill="#5E6477">Set internal delivery estimates and track progress.</text>

