  <text x="110" y="710" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#1F2640">What's different</text>
  <text x="110" y="770" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#1F2640">about Manage?</text>
  <text x="110" y="830" font-family="Arial, sans-serif" font-size="20" fill="#5E6477">Manage provides all the functionality your team needs,</text>
  <text x="110" y="860" font-family="Arial, sans-serif" font-size="20" fill="#5E6477">without the complexity. Our software is tailor-made</text>
  <text x="110" y="890" font-family="Arial, sans-serif" font-size="20" fill="#5E6477">for modern digital product teams.</text>

