  <text x="780" y="725" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">01</text>
  <text x="840" y="720" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2640">Track company-wide progress</text>
  <text x="840" y="755" font-family="Arial, sans-serif" font-size="18" fill="#5E6477">See how your day-to-day tasks fit into the wider vision.</text>

