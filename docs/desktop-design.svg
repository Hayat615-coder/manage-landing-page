  <text x="780" y="905" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">03</text>
  <text x="840" y="900" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2640">Everything you need in one place</text>
  <text x="840" y="935" font-family="Arial, sans-serif" font-size="18" fill="#5E6477">Stop jumping between tools and keep your work in sync.</text>
